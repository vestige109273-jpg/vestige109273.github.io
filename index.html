    <h1>SO Backup</h1>
    <p>SO Backup 是個人使用的 SQL Server 自動備份工具。</p>
    <p>工具會在使用者自己的 Windows VPS 上建立 SQL Server 備份，完成完整性檢查後，上傳到使用者授權的 Google Drive 資料夾。工具也可依使用者設定的保留天數清理舊備份。</p>
    <p>本工具不是公開服務，不提供第三方註冊，也不會出售或分享 Google 使用者資料。</p>
